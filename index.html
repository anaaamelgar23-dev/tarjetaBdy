<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa de Cumpleaños!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #fff; overflow-x: hidden; }
        .container { text-align: center; width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #f8fafc; }
        p { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 25px; }
        
        /* Caja de regalo */
        .gift-box { font-size: 5rem; cursor: pointer; animation: bounce 1.5s infinite; margin: 20px 0; transition: transform 0.3s; display: inline-block; }
        .gift-box:active { transform: scale(0.9); }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .tap-text { font-size: 0.9rem; color: #fbbf24; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Tarjeta de Regalo VIP */
        .coupon-card { background: linear-gradient(135deg, #b45309, #d97706, #f59e0b); border-radius: 20px; padding: 25px 20px; color: #fff; box-shadow: 0 8px 25px rgba(217, 119, 6, 0.4); position: relative; overflow: hidden; border: 2px solid #fef3c7; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .coupon-header { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; opacity: 0.9; margin-bottom: 5px; }
        .amount { font-size: 3rem; font-weight: 800; margin: 10px 0; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .code-box { background: rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 8px 12px; font-family: monospace; font-size: 1.1rem; letter-spacing: 2px; margin: 15px 0; border: 1px dashed rgba(255,255,255,0.4); }
        
        /* Opciones de canje */
        .options-container { margin-top: 20px; text-align: left; }
        .options-container label { font-size: 0.85rem; color: #fef3c7; display: block; margin-bottom: 8px; font-weight: 600; }
        select, input[type="text"] { width: 100%; padding: 12px; border-radius: 10px; border: none; background: rgba(255,255,255,0.9); color: #1e293b; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
        
        .whatsapp-btn { background: #25d366; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); transition: transform 0.2s; }
        .whatsapp-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Pantalla Inicial -->
        <div id="welcome-screen">
            <h1>¡Feliz Cumpleaños brocito! 🎉</h1>
            <p>Tienes una sorpresa esperándote aquí abajo :3 Tócala para abrirla.</p>
            <div class="gift-box" onclick="openGift()">🎁</div>
            <div class="tap-text">¡Toca la cajita!</div>
        </div>

        <!-- Pantalla del Premio -->
        <div id="prize-screen" class="hidden">
            <div class="coupon-card">
                <div class="coupon-header">Bono de Cumpleañero</div>
                <div class="amount">$30 pesitos</div>
                <p style="color: #fff; font-size: 0.9rem; margin-bottom: 10px;">¡Para que te des un gran gustito hoy!</p>
                <div class="code-box">CÓDIGO: HB-BRO-30</div>
            </div>

            <div class="options-container">
                <label for="gift-choice">¿En qué vas a gastar tu bonito :3 ?</label>
                <select id="gift-choice">
                    <option value="Comida o antojos 🍔">Comidita o antojos 🍔</option>
                    <option value="Videojuegos o tecnología 🎮">tecnología 🎮</option>
                    <option value="Ropa o accesorios 👕">Ropita o accesorios 👕</option>
                    <option value="Una salida a pasear 🥤">Una salidita a pasear 🥤</option>
                    <option value="Ahorro para algo grande 💰">Ahorrar para alguito mas 💰</option>
                </select>

                <button class="whatsapp-btn" onclick="claimPrize()">
                    <span>📩 Canjear mis $30 con Almi y Gaby</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function openGift() {
            // Efecto de confeti
            confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
            
            // Cambiar pantallas
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('prize-screen').classList.remove('hidden');
        }

        function claimPrize() {
            const choice = document.getElementById('gift-choice').value;
            const message = `¡Holis! Ya abrí mi regalo de cumpleaños 🎁. Canjeo mi bono de $30 pesitos (Código: HB-BROCITO-30) y lo quiero usar en: ${choice}`;
            // Como está en celular, esto abrirá WhatsApp directamente para enviártelo a ti
            window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        }
    </script>
</body>
</html>
